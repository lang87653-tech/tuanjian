<style>
  :root{
    /* iOS 系统风（原生苹果质感） */
    --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --muted:#8E8E93;
    --accent:#007AFF; --accent-soft:rgba(0,122,255,.10); --line:rgba(60,60,67,.12);
    --blue:#007AFF; --green:#34C759; --orange:#FF9500; --yellow:#FFC400;
    --radius:16px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 20px rgba(0,0,0,.05);
    --hairline:rgba(60,60,67,.10);
    --surface:#F2F2F7; --surface-2:#E9E9EB; --surface-3:#F2F2F7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  body{background:var(--bg);color:var(--ink);}
  .phone{width:100%;max-width:480px;margin:0 auto;position:relative;background:var(--bg);min-height:100vh;min-height:100dvh;}

  .wrap{display:block;padding:0 0 120px;scrollbar-width:none;-ms-overflow-style:none;}
  .wrap::-webkit-scrollbar{display:none;}

  /* Header */
  .header-zone{position:relative;padding-bottom:4px;background:linear-gradient(180deg,rgba(0,122,255,.04) 0%,rgba(0,122,255,0) 75%);}
  .hb-btn{font-size:12px;font-weight:600;color:var(--ink);background:#FFFFFF;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:.15s;display:flex;align-items:center;justify-content:center;gap:4px;}
  .hb-btn:hover{background:#FAFAFA;border-color:rgba(0,0,0,.12);}
  .hb-btn:active{transform:scale(.96);background:#EFEFF1;}
  .hb-btn.syncing{color:#999;border-color:rgba(0,0,0,.08);background:#F5F5F7;pointer-events:none;}
  .hb-btn.syncing::after{content:'';display:inline-block;width:13px;height:13px;border:2px solid #999;border-top-color:transparent;border-radius:50%;animation:spin .65s linear infinite;margin-left:4px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .pad{padding:16px 16px 0;}

  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--radius);padding:18px;margin-bottom:14px;transition:border-color .2s,box-shadow .2s,transform .2s;box-shadow:var(--shadow);}
  .card:active{transform:scale(.99);}
  .card.voted{border-color:var(--accent);box-shadow:0 1px 3px rgba(0,122,255,.06),0 12px 28px rgba(0,122,255,.12);}
  .c-top{display:flex;align-items:center;gap:13px;}
  .c-icon{width:52px;height:52px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden;background:var(--surface-2);border:none;}
  .c-icon img{width:100%;height:100%;object-fit:cover;}
  .c-info{flex:1;min-width:0;}
  .c-name{font-size:18px;font-weight:800;line-height:1.25;letter-spacing:-.4px;}
  .c-place{font-size:12px;color:var(--muted);margin-top:3px;font-weight:500;letter-spacing:.1px;}
  .c-arrow{width:26px;height:26px;border-radius:50%;background:transparent;border:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:rgba(142,142,147,.5);transition:.15s;}
  .card:active .c-arrow{transform:translateX(2px);color:var(--accent);}
  .c-arrow svg{width:13px;height:13px;stroke-width:1.8;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px;}
  .tag{font-size:11px;color:var(--muted);background:transparent;border:1px solid rgba(60,60,67,.10);padding:3px 9px;border-radius:14px;font-weight:400;}

  .data-row{display:flex;align-items:center;gap:18px;margin-top:13px;padding-top:12px;border-top:1px solid var(--hairline);}
  .data-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:3px;font-weight:500;}
  .data-item b{color:var(--ink);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;}

  .desc{font-size:12.5px;color:#6E6E73;line-height:1.6;margin-top:12px;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;display:-webkit-box;}

  .vote-btn{width:100%;margin-top:15px;border:1px solid rgba(26,26,28,.10);border-radius:13px;padding:14px 0;font-size:15px;font-weight:700;background:#fff;color:var(--ink);transition:.15s;cursor:pointer;letter-spacing:.3px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .vote-btn:active{transform:scale(.985);background:var(--bg);}
  .vote-btn.done{border-color:var(--accent);color:#fff;background:var(--accent);}

  /* 统计页 */
  .r-head{padding:0 0 14px;}
  .r-head .t{font-size:20px;font-weight:700;letter-spacing:-.2px;}
  .r-head .s{font-size:12px;color:var(--muted);margin-top:3px;font-weight:500;}

  .overview-card{background:#FFFFFF;border:1px solid var(--hairline);border-radius:16px;padding:20px 18px 17px;margin-bottom:15px;display:flex;gap:4px;align-items:center;box-shadow:var(--shadow);}
  .ov-item{flex:1;text-align:center;min-width:0;padding:0 3px;}
  .ov-num{font-size:38px;font-weight:800;color:var(--ink);line-height:1.05;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .ov-lbl{font-size:11px;color:var(--muted);margin-top:5px;font-weight:500;letter-spacing:.15px;}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .sg-card{position:relative;background:#FFFFFF;border:1px solid var(--hairline);border-radius:14px;padding:14px 14px 14px 16px;overflow:hidden;box-shadow:var(--shadow);}
  .sg-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:3px 0 0 3px;}
  .sg-card.alt::before{background:var(--blue);}
  .sg-row{display:flex;align-items:baseline;gap:8px;}
  .sg-num{font-size:38px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;}
  .sg-unit{font-size:12px;font-weight:600;color:var(--muted);}
  .sg-lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.1px;margin-top:6px;}

  .row2{display:flex;gap:10px;}
  .row2 .inp{flex:1;}
  .it-input-sec{margin-top:4px;}
  .it-day-card{background:#FAFBFC;border:1px solid #E8ECF1;border-radius:12px;padding:14px 14px 12px;margin-top:10px;transition:.15s;}
  .it-day-card:first-child{margin-top:0;}
  .it-day-hd{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .it-day-badge{font-size:10.5px;font-weight:700;color:#fff;background:var(--ink);padding:3px 9px;border-radius:6px;letter-spacing:.3px;text-transform:uppercase;}
  .it-day-title-inp{flex:1;border:1px solid #E4E7EB;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);outline:none;transition:.15s;}
  .it-day-title-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.06);}
  .it-day-title-inp::placeholder{color:#B8BCC4;}
  .it-items-label{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:500;display:flex;align-items:center;gap:4px;}
  .it-items-inp{width:100%;border:1px solid #E4E7EB;border-radius:8px;padding:9px 10px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink);outline:none;resize:none;height:64px;line-height:1.55;transition:.15s;}
  .it-items-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.05);}
  .it-items-inp::placeholder{color:#B8BCC4;}
  .it-empty-hint{text-align:center;color:var(--muted);font-size:12.5px;padding:18px 0;opacity:.6;}

  .stat-card{background:#FFFFFF;border:1px solid var(--hairline);border-radius:15px;padding:0;margin-bottom:11px;overflow:hidden;box-shadow:var(--shadow);}
  .stat-hd{display:flex;align-items:center;padding:14px 14px 10px;gap:10px;}
  .stat-emoji{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--surface-2);border:none;flex-shrink:0;}
  .stat-info{flex:1;min-width:0;}
  .stat-name{font-size:15px;font-weight:700;letter-spacing:-.1px;}
  .stat-v{font-size:12px;color:var(--muted);font-weight:500;margin-top:1px;}
  .stat-pct-badge{font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:7px;flex-shrink:0;}
  .stat-bar-wrap{padding:0 14px 7px;}
  .stat-card .bar{height:5px;background:rgba(0,0,0,.06);border-radius:3px;overflow:hidden;}
  .stat-card .fill{height:100%;border-radius:3px;background:var(--accent);transition:width .65s ease;}
  .stat-notes{padding:0 14px 13px;border-top:1px solid var(--line);background:#fff;}
  .note-item{display:flex;gap:8px;padding:8px 0;}
  .note-item:last-child{padding-bottom:0;}
  .note-avatar{width:26px;height:26px;border-radius:50%;background:#F4F4F6;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:var(--muted);}
  .note-body{flex:1;min-width:0;}
  .note-who{font-size:11.5px;font-weight:700;color:var(--ink);}
  .note-who .me-tag{font-size:9px;font-weight:600;color:#fff;background:var(--green);padding:1.5px 5px;border-radius:4px;margin-left:4px;vertical-align:middle;}
  .note-text{font-size:12px;color:#888;line-height:1.42;margin-top:1px;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;display:-webkit-box;}
  .notes-empty{font-size:12px;color:var(--muted);padding:13px 14px;text-align:center;}

  /* 悬浮Tab Bar */
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;bottom:32px;height:64px;background:rgba(255,255,255,.92);border:1px solid var(--hairline);border-radius:28px;display:flex;align-items:center;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.10);}
  .tabitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10px;font-weight:600;cursor:pointer;background:none;border:none;border-radius:18px;transition:.2s ease;}
  .tabitem svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;transition:.2s ease;filter:grayscale(.15);}
  .tabitem.active{color:var(--accent);font-weight:700;}
  .tabitem.active svg{filter:none;transform:scale(1.04);}
  .tabitem.mid-wrap{position:relative;flex:0 0 60px;display:flex;align-items:center;justify-content:center;}
  .mid-fab{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,122,255,.35);cursor:pointer;transition:.2s cubic-bezier(.25,.46,.45,.94);border:none;position:relative;top:0;left:0;}
  .mid-fab svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;}
  .mid-fab:active{transform:scale(.88);background:#0062CC;}
  .mid-label{display:none;}

  /* Detail */
  .detail{position:fixed;inset:0;background:#FFFFFF;z-index:50;display:none;flex-direction:column;animation:dIn .28s cubic-bezier(.2,.8,.2,1);}
  .detail.show{display:flex;}
  @keyframes dIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .d-hero-wrap{position:relative;height:224px;flex-shrink:0;background:#E8E8ED;overflow:hidden;}
  .d-hero{width:100%;height:100%;object-fit:cover;display:block;}
  .d-hero-wrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.22) 100%);pointer-events:none;}
  .d-hero-wrap::before{content:"";position:absolute;left:0;right:0;top:0;height:54px;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 100%);pointer-events:none;z-index:1;}
  .d-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;border:none;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;}
  .d-tag{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.46);color:#fff;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:18px;z-index:2;}
  .d-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px 110px;scrollbar-width:none;-ms-overflow-style:none;}
  .d-body::-webkit-scrollbar{display:none;}
  .d-title{font-size:21px;font-weight:700;letter-spacing:-.2px;}
  .d-meta{display:flex;gap:14px;margin-top:10px;font-size:12.5px;color:var(--muted);}
  .d-meta b{color:var(--ink);font-weight:600;font-size:13px;}
  .d-desc{font-size:13px;color:#666;line-height:1.6;margin-top:10px;}
  .d-seg{display:flex;background:#F2F2F7;border-radius:12px;padding:3px;margin:18px 0 4px;position:sticky;top:0;z-index:6;}
  .d-seg button{flex:1;border:none;background:none;font-size:13px;font-weight:600;color:var(--muted);padding:8px 4px;border-radius:9px;cursor:pointer;transition:.22s cubic-bezier(.25,.46,.45,.94);display:flex;align-items:center;justify-content:center;gap:5px;}
  .d-seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.04);}
  .d-seg button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
  .d-tab{display:none;}
  .d-tab.active{display:block;animation:segIn .26s cubic-bezier(.2,.8,.2,1);}
  .d-tab-hd{font-size:14px;font-weight:700;color:var(--ink);margin:16px 0 12px;display:flex;align-items:center;gap:7px;letter-spacing:-.2px;}
  @keyframes segIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .empty-hint{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}
  .it-day{background:#FAFBFC;border:1px solid #F0F1F3;border-radius:13px;padding:14px 14px 12px;margin-bottom:10px;}
  .it-day:last-child{margin-bottom:0;}
  .it-day-hd{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .it-day-num{font-size:11px;font-weight:800;color:#fff;background:var(--accent);padding:3px 8px;border-radius:5px;letter-spacing:.4px;flex-shrink:0;text-transform:uppercase;}
  .it-day-title{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.2px;line-height:1.35;}
  .it-items{padding-left:4px;display:flex;flex-direction:column;gap:6px;}
  .it-item{font-size:12.5px;color:#444;line-height:1.55;padding:5px 0 5px 18px;position:relative;}
  .it-item::before{content:'';position:absolute;left:4px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.55;}
  .note-sub{font-size:11px;color:var(--muted);margin-bottom:8px;}
  .note-input{width:100%;border:1px solid var(--line);border-radius:14px;padding:16px 15px;font-size:14px;font-family:inherit;background:#fff;outline:none;color:var(--ink);resize:none;height:130px;line-height:1.65;box-shadow:0 1px 3px rgba(0,0,0,.03) inset;transition:.2s;}
  .note-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(0,122,255,.08),0 1px 3px rgba(0,0,0,.02) inset;}
  .note-input::placeholder{color:#B8BCC4;font-size:13.5px;line-height:1.6;}
  .note-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
  .nc-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid #D4D6DB;border-radius:20px;background:#F8F9FA;color:#555B65;font-size:12px;font-weight:500;cursor:pointer;transition:.15s ease;user-select:none;-webkit-user-select:none;}
  .nc-chip:hover{background:#EEF0F3;border-color:#C4C7CC;color:var(--ink);}
  .nc-chip:active{transform:scale(.94);background:#E4E6EA;}
  .nc-chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;opacity:.45;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;}
  .ph{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--bg);position:relative;}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .d-vote{position:absolute;left:16px;right:16px;bottom:32px;border:1px solid rgba(28,28,30,.10);border-radius:13px;padding:15px;font-size:15px;font-weight:700;background:#fff;color:var(--ink);cursor:pointer;z-index:2;letter-spacing:.3px;box-shadow:0 1px 4px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.03);}
  .d-vote:active{transform:scale(.97);background:var(--bg);}
  .d-vote.done{border-color:var(--accent);color:#fff;background:var(--accent);}

  /* 半屏提名 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:flex-end;}
  .mask.show{display:flex;}
  .sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:0;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;animation:sUp .32s cubic-bezier(.2,.8,.2,1);}
  @keyframes sUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .sheet-grab{width:36px;height:4.5px;border-radius:2.5px;background:#D1D1D6;margin:8px auto 10px;flex-shrink:0;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:0 20px 12px;flex-shrink:0;}
  .sheet-head .t{font-size:18px;font-weight:700;letter-spacing:-.3px;color:var(--ink);}
  .sheet-close{width:30px;height:30px;border-radius:50%;background:var(--bg);border:none;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:.12s;}
  .sheet-close:active{background:#E5E5EA;transform:scale(.92);}
  .sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 14px;scrollbar-width:none;-ms-overflow-style:none;}
  .sheet-body::-webkit-scrollbar{display:none;}

  .sg{margin-bottom:16px;}
  .sg:last-child{margin-bottom:0;}
  .sg-lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.2px;margin-bottom:7px;text-transform:uppercase;}

  .epick{display:flex;flex-wrap:wrap;gap:7px;}
  .epick button{font-size:19px;width:40px;height:40px;border:1px solid #E4E4E7;background:#fff;border-radius:50%;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;}
  .epick button.on{border-color:var(--accent);background:rgba(0,122,255,.07);box-shadow:0 0 0 3px rgba(0,122,255,.08);}
  .epick button:active{transform:scale(.9);}

  .inp{width:100%;border:1px solid #D8DCDF;border-radius:11px;padding:13px 14px;font-size:14.5px;font-family:inherit;background:#F9F9FB;outline:none;color:var(--ink);transition:.2s;}
  .inp:hover{background:#F4F4F7;border-color:#CDD0D3;}
  .inp:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(0,122,255,.09);}
  .inp::placeholder{color:#B8B8BE;}
  textarea.inp{resize:none;height:64px;line-height:1.5;}
  .inp{flex:1;min-width:0;}

  .upload-zone{border:1px dashed #D1D1D6;border-radius:12px;padding:13px;display:flex;align-items:center;justify-content:center;gap:7px;background:#FAFAFB;cursor:pointer;transition:.15s;}
  .upload-zone:active{background:#F0F0F2;border-color:#BABABE;}
  .upload-zone .up-icon{display:flex;align-items:center;flex-shrink:0;}

  function load(){

    state.votes={};
    state.schemes.forEach(s=>{state.votes[s.id]=(saved&&saved[s.id]!=null)?saved[s.id]:(s.base||0);});
    state.myVote=localStorage.getItem(LS_MY)||null;
    state.notes=JSON.parse(localStorage.getItem(LS_NOTES)||'null');
    if(!state.notes){
      state.notes={};
      Object.keys(SEED_NOTES).forEach(id=>{ state.notes[id]=SEED_NOTES[id].map(n=>({...n})); });
      localStorage.setItem(LS_NOTES,JSON.stringify(state.notes));
    }
    if(!localStorage.getItem(LS_DEAD)) localStorage.setItem(LS_DEAD,Date.now()+3*24*3600*1000);

  function save(){
    localStorage.setItem(LS_VOTES,JSON.stringify(state.votes));
    if(state.myVote)localStorage.setItem(LS_MY,state.myVote);else localStorage.removeItem(LS_MY);

  function totalVotes(){return Object.values(state.votes).reduce((a,b)=>a+b,0);}
  function sorted(){return[...state.schemes].sort((a,b)=>state.votes[b.id]-state.votes[a.id]);}
  function nameOf(id){const s=state.schemes.find(x=>x.id===id);return s?s.name:id;}

  function vote(id,cb){
    if(state.myVote===id){
      /* 取消投票：减票、清 myVote */
      state.votes[id]--;
      state.myVote=null;
      save();render();if(cb)cb();
      toast('已取消投票');
      return;
    }
    if(state.myVote)state.votes[state.myVote]--;
    state.votes[id]++;
    state.myVote=id;
    save();render();if(cb)cb();
    toast('已投给「'+nameOf(id)+'」');
  }

  function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

    Object.keys(state.notes).forEach(sid=>{ state.notes[sid]=state.notes[sid].filter(n=>n.who!=='我'); });
    if(note){
      if(!state.notes[id])state.notes[id]=[];
      state.notes[id].push({who:'我',text:note,t:Date.now()});
    }
    saveNotes();
  }

    attachNote(id, ta?ta.value.trim():'');

  function cdText(){
    const d=parseInt(localStorage.getItem(LS_DEAD));let diff=d-Date.now();
    if(diff<=0)return'已截止';
    const day=Math.floor(diff/86400000);diff-=day*86400000;
    const hr=Math.floor(diff/3600000);diff-=hr*3600000;
    const min=Math.floor(diff/60000);
    return`${day}d ${hr}h ${min}m`;
  }

    box.innerHTML=EMOJIS.map(e=>`<button class="${e===pickEmoji?'on':''}" onclick="pickE('${e}')">${e}</button>`).join('');}
  function pickE(e){pickEmoji=e;buildEP();}

  function handleFiles(files){
    if(!files||!files.length)return;
    const remain=9-uploadedImgs.length;
    if(remain<=0){toast('最多 9 张');return;}
    Array.from(files).slice(0,remain).forEach(f=>{
      if(!f.type||!f.type.startsWith('image/'))return;
      const r=new FileReader();
      r.onload=e=>{uploadedImgs.push(e.target.result);renderPreviews();};
      r.readAsDataURL(f);
    });
  }
  function renderPreviews(){
    const g=document.getElementById('prevGrid');
    g.innerHTML=uploadedImgs.map((src,i)=>`<div class="preview-thumb"><img src="${src}"><button class="rm" onclick="rmImg(${i})">✕</button></div>`).join('');
  }
  function rmImg(i){uploadedImgs.splice(i,1);renderPreviews();}

  function submitNom(){
    const n=document.getElementById('fN').value.trim();
    const dy=parseInt(document.getElementById('fD').value)||0;
    const pr=parseInt(document.getElementById('fPr').value)||0;
    const tg=document.getElementById('fT').value.split(/[,，]/).map(t=>t.trim()).filter(Boolean);
    const ds=document.getElementById('fDsc').value.trim();
    if(!n){toast('请填写方案名称');return;}
    // 收集行程计划
    const itineraries=[];
    for(let d=1;d<=dy;d++){
      const titleEl=document.getElementById('itTitle'+d);
      const itemsEl=document.getElementById('itItems'+d);
      if(titleEl||itemsEl){
        const t=(titleEl?titleEl.value.trim():'') || ('Day '+d);
        const items=(itemsEl?itemsEl.value.trim():'').split('\n').map(x=>x.trim()).filter(Boolean);
        if(items.length) itineraries.push({day:d,title:t,items:items});
      }
    }
    const id='c'+Date.now();
    const c=JSON.parse(localStorage.getItem(LS_CUSTOM)||'[]');
    c.push({id,emoji:pickEmoji,name:n,place:'自定义',days:dy,price:pr,tags:tg.length?tg:['新提名'],desc:ds||'等你来补充～',base:0,
      imgs: uploadedImgs.length? uploadedImgs : Array.from({length:6},(_,i)=>realImg('自定义', i)),
      itinerary:itineraries.length?itineraries:[]});
    localStorage.setItem(LS_CUSTOM,JSON.stringify(c));
    pickEmoji='🏖️';
    closeNom();load();switchView('vote');toast('已提名');
  }

    for(let i=1;i<=dy;i++){
      html+=`<div class="it-day-card">
        <div class="it-day-hd"><span class="it-day-badge">Day ${i}</span><input class="it-day-title-inp" id="itTitle${i}" placeholder="主题，如：抵达${pName()}" oninput="updateItBadge(${i})"></div>
        <div class="it-items-label">📋 行程项目（每行一项）</div>
        <textarea class="it-items-inp" id="itItems${i}" placeholder="例如：&#10;✈️ 飞抵目的地&#10;🏨 入住酒店&#10;🍽️ 欢迎晚宴"></textarea></div>`;
    }
    sec.innerHTML=html;
  }
  function pName(){const el=document.getElementById('fN');return el?(el.value.trim()||'目的地'):'目的地';}
  function updateItBadge(d){const el=document.getElementById('itTitle'+d);if(el&&el.value.trim()){const badge=el.parentElement.querySelector('.it-day-badge');if(badge)badge.textContent=el.value.trim().slice(0,8);}}

  /* App 分享链接（GitHub Pages，微信内可直接打开） */
  const APP_SHARE_URL='https://lang87653-tech.github.io/tuanjian/';
  function shareApp(){
    const u=APP_SHARE_URL;
    if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('链接已复制')).catch(()=>toast(u));
    else toast(u);
  }

  /* ===== 同步到腾讯文档智能表格（第一种模式：直接写入云端智能表） ===== */
  /* 已创建的智能表格：https://docs.qq.com/smartsheet/DR2RFb2VQbEJpTUx4 */
  const TBDOC_URL='https://docs.qq.com/smartsheet/DR2RFb2VQbEJpTUx4';
  const TBDOC_FILE_ID='GdEoePlBiMLx';
  let _syncing=false;
  function syncToDoc(){
    if(_syncing)return;
    const btn=document.querySelector('.hb-btn.syncing')||document.querySelector('.hb-btn');
    if(btn){btn.classList.add('syncing');btn.textContent='同步中';}
    _syncing=true;

    // 收集数据
    var schemes=state.schemes, votes=state.votes, notes=state.notes, tot=totalVotes();
    var rows=[];
    schemes.forEach(function(s){
      var v=votes[s.id]||0, pct=tot?Math.round(v/tot*100):0;
      var schemeNotes=(notes[s.id]||[]);
      var voters=schemeNotes.map(function(n){return n.who;}).filter(Boolean);
      rows.push({
        '方案名称': s.name,
        '目的地': s.place,
        '天数': s.days,
        '人均预算': s.price,
        '票数': v,
        '得票率': pct+'%',
        '投票人': voters.join('\u3001') || '-',
        '备注汇总': schemeNotes.map(function(n){return n.who+'\uFF1A'+n.text;}).join('\n') || '-'
      });
    });

    // 第一种模式：宿主注入桥接时，直接写入腾讯文档智能表格（实时）
    if(typeof window.__tencentDocsSync==='function'){
      window.__tencentDocsSync(rows).then(function(){
        toast('\u5DF2\u540C\u6B65\u5230\u817E\u8BAF\u6587\u6863 \u2713');
        resetSyncBtn(btn);
      }).catch(function(e){
        console.error('sync error:',e);
        syncFallback(rows, btn);
      });
    }else{
      syncFallback(rows, btn);
    }
  }
  function syncFallback(rows, btn){
    // 未注入桥接：打开已创建的腾讯文档智能表格（第一种模式文档）+ 导出 CSV 备份
    try{ window.open(TBDOC_URL, '_blank'); }catch(e){}
    var csv='\uFEFF\u65B9\u6848\u540D\u79F0,\u76EE\u7684\u5730,\u5929\u6570,\u4EBA\u5747\u9884\u7B97,\u7968\u6570,\u5F97\u7968\u7387,\u6295\u7968\u4EBA,\u5907\u6CE8\u6C47\u603B\n';
    rows.forEach(function(r){
      csv+=[
        r['\u65B9\u6848\u540D\u79F0'],r['\u76EE\u7684\u5730'],r['\u5929\u6570'],r['\u4EBA\u5747\u9884\u7B97'],
        r['\u7968\u6570'],r['\u5F97\u7968\u7387'],r['\u6295\u7968\u4EBA'],
        String(r['\u5907\u6CE8\u6C47\u603B']).replace(/"/g,'""').replace(/\n/g,' | ')
      ].map(function(c){return '"'+c+'"';}).join(',')+'\n';
    });
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='\u56E2\u5EFA\u65C5\u884C\u6295\u7968\u7EDF\u8BA1_'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')+'.csv';
    a.click();URL.revokeObjectURL(a.href);
    toast('\u5DF2\u6253\u5F00\u817E\u8BAF\u6587\u6863\u667A\u80FD\u8868\u683C');
    resetSyncBtn(btn);
  }
  function resetSyncBtn(btn){
    if(btn){btn.classList.remove('syncing');btn.textContent='\u540C\u6B65\u5230\u6587\u6863';}
    _syncing=false;
  }

  /* 腾讯文档桥接接口（宿主注入 bridge 时，按钮直接写入云端智能表，无需 CSV） */
  window.__setTencentDocsSync=function(fn){window.__tencentDocsSync=fn;};
  let tt;
  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1700);}


  /* ===== Hero 轮播（v9 无 Hero Banner，保留兼容空函数）===== */
  function initHero(){ /* no-op in v9 (Hero banner removed) */ }
  /* GitHub Pages 微信内可直接打开，无需引导条 */
  function wechatTip(){ /* no-op */ }

  window.onerror=function(msg,src,line,col,err){document.title='JS ERROR: '+msg+' (line '+line+')';console.error('TBV-ERR:',msg,'at',line+':'+col,err);return false;};
  try{load();render();initHero();wechatTip();}catch(e){document.title='CRASH: '+e.message;document.getElementById('wrap').innerHTML='<pre style="padding:20px;color:red">CRASH: '+e.message+'\n\n'+e.stack+'</pre>';}
  setInterval(()=>{if(state.view==='vote')try{render();}catch(e){console.error('render err:',e);}},30000);
</script>
